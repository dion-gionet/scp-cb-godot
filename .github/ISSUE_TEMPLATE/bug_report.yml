name: Bug report
description: The port behaves differently from SCP - Containment Breach 1.3.11, or something is broken
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what the original does instead (a Blitz source reference such as `NPCs.bb:5003` helps).
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed
      description: The map seed, if you know it.
  - type: input
    id: room
    attributes:
      label: Room
      description: The room name, from the developer console (F3) or the debug overlay.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit.
