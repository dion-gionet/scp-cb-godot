name: Release

# Run by hand (Actions > Release > Run workflow) with the tag to publish, e.g. v1.2.0: exports the game for Windows, Linux
# and macOS, puts the game files next to each build, publishes one zip per platform, then deploys the web build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created if it does not exist), e.g. v1.2.0"
        required: true
        type: string

env:
  GODOT_VERSION: "4.7.2"
  BASE_VERSION: "1.3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop"
            binary: scp-cb-godot-port.exe
          - platform: linux
            preset: "Linux"
            binary: scp-cb-godot-port.x86_64
          - platform: macos
            preset: "macOS"
            binary: scp-cb-godot-port-macos.zip
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # The game files come from the assets release of this repository; fetch_assets.py checks their sha256.
      - name: Fetch game files
        run: python3 tools/fetch_assets.py --dest build/package/assets

      - name: Export
        run: |
          godot --headless --import || true
          if [ "${{ matrix.platform }}" = macos ]; then
            godot --headless --export-release "${{ matrix.preset }}" "build/${{ matrix.binary }}"
            unzip -q "build/${{ matrix.binary }}" -d build/package
          else
            godot --headless --export-release "${{ matrix.preset }}" "build/package/${{ matrix.binary }}"
          fi
          cp CREDITS.md LICENSE build/package/

      - name: Zip
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then chmod +x build/package/${{ matrix.binary }}; fi
          cd build/package && zip -r -q -y "../scp-cb-godot-port-${BASE_VERSION}-${{ matrix.platform }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: scp-cb-godot-port-${{ matrix.platform }}
          path: build/scp-cb-godot-port-*-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scp-cb-godot-port-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }} (SCP:CB ${{ env.BASE_VERSION }})
          files: dist/*.zip
          discussion_category_name: Announcements
          generate_release_notes: true
          body: |
            SCP: Containment Breach – Godot Port, based on SCP:CB ${{ env.BASE_VERSION }}. Unzip and run; the game files are in the `assets` folder.

            Web version (runs in the browser, mostly for fun; some features and effects may be missing): https://dion-gionet.github.io/scp-cb-godot/

            macOS: the build is not signed. If it will not open, right-click the app and choose Open, or run `xattr -cr` on it.
            Linux: run `chmod +x scp-cb-godot-port.x86_64` if the zip did not keep the executable bit.

  web:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
