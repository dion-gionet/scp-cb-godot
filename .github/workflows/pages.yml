name: Web

# Exports the game for the browser and deploys it to GitHub Pages: when a release is published, from the Release
# workflow, or by hand (Actions > Web > Run workflow). Needs Settings > Pages > Source: GitHub Actions.
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

env:
  GODOT_VERSION: "4.7.2"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Fetch game files
        run: python3 tools/fetch_assets.py --dest build/assets

      - name: Export
        run: |
          godot --headless --import || true
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          python3 tools/pack_web_assets.py --src build/assets --out build/web/web-assets
          cp CREDITS.md LICENSE build/web/
          touch build/web/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
