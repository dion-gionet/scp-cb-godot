name: Release

# On a version tag: export the game, put the game files next to it, publish one zip.
on:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # The game files come from the assets release of this repository; fetch_assets.py checks their sha256.
      - name: Fetch game files
        run: python3 tools/fetch_assets.py --dest build/package/assets

      - name: Export
        run: |
          godot --headless --import || true
          godot --headless --export-release "Windows Desktop" build/package/scp-cb.exe
          cp CREDITS.md LICENSE build/package/

      - name: Zip
        run: cd build/package && zip -r -q ../scp-cb-windows.zip .

      - uses: softprops/action-gh-release@v3
        with:
          files: build/scp-cb-windows.zip
